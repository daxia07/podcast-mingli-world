name: Build episode

# Builds and publishes blueprints from CI, because the dev Mac has neither
# ffmpeg nor edge-tts nor a Cloudflare token. Manual trigger only — this spends
# a TTS run and writes to production R2.
#
#   gh workflow run build-episode.yml -f show=aws-ai-practitioner
#   gh workflow run build-episode.yml -f blueprint=content/blueprints/x/y.json
#   gh workflow run build-episode.yml -f show=... -f dry_run=true

on:
  workflow_dispatch:
    inputs:
      blueprint:
        description: 'Path to a single blueprint JSON'
        required: false
      show:
        description: 'Build every blueprint for this show'
        required: false
      dry_run:
        description: 'Gate and plan only — no audio, no upload'
        type: boolean
        default: false

# Episode ids are allocated by reading the manifest and taking the next free
# number, then written back in a commit at the end of the run. Two runs at once
# therefore read the same manifest, allocate the same id, and the second one to
# finish loses its commit to a rebase conflict — which is exactly what happened
# on 2026-08-13 when aws-solutions-architect and aws-security-specialty were
# built a few seconds apart. Both claimed id 363.
#
# Queue instead of cancelling: a cancelled run would be killed mid-publish, with
# audio already in R2 and nothing recording it.
concurrency:
  group: build-episode
  cancel-in-progress: false

permissions:
  contents: write
  # The publish commit carries [skip ci], so nothing would redeploy the site and
  # the new episodes would stay unsearchable until an unrelated push. The last
  # step dispatches Deploy explicitly instead.
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        if: ${{ inputs.dry_run != true }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve the blueprint list
        id: list
        run: |
          set -e
          if [ -n "${{ inputs.blueprint }}" ]; then
            echo "${{ inputs.blueprint }}" > /tmp/list.txt
          elif [ -n "${{ inputs.show }}" ]; then
            find "content/blueprints/${{ inputs.show }}" -name '*.json' | sort > /tmp/list.txt
          else
            echo "::error::give either 'blueprint' or 'show'"; exit 1
          fi
          echo "found $(wc -l < /tmp/list.txt) blueprint(s):"
          cat /tmp/list.txt

      - name: Build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '0629de91516b2b363d1215708eaa5332'
          BASE_URL: https://podcast.mingli.world
        run: |
          set -e
          # `data` is committed as a symlink to another machine (AGENTS.md
          # gotcha #1), so it exists but is broken and mkdir -p fails on it.
          [ -L data ] && rm -f data
          mkdir -p data
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          # Read on fd 3, not stdin: ffmpeg inherits stdin and would eat the
          # rest of the list. synth.py also passes stdin=DEVNULL now.
          while read -r bp <&3; do
            [ -z "$bp" ] && continue
            echo "::group::$bp"
            python3 scripts/build_episode.py "$bp" $FLAGS < /dev/null
            echo "::endgroup::"
          done 3< /tmp/list.txt

      # The moment index is built from the transcripts that were just uploaded,
      # read back over public HTTPS so previously published episodes stay in it
      # too — data/ only holds what this run happened to build.
      - name: Rebuild the search index
        if: ${{ inputs.dry_run != true }}
        env:
          BASE_URL: https://podcast.mingli.world
        run: python3 scripts/build_search_index.py

      - name: Commit manifest and blueprint updates
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/manifest.json site/manifest.json content/blueprints site/search-index.json || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: publish episodes [skip ci]"
            git pull --rebase --autostash origin master
            git push
          fi

      - name: Deploy the new episodes
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master

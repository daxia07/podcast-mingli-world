name: Video companion release
on:
  push:
    branches: [video-companion-release]
    paths: ['video-companion/**', '.github/workflows/video-companion.yml']
jobs:
  deploy-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and validate companion
        working-directory: video-companion
        run: npm test && npm run validate && node scripts/private-bundle-scan.mjs
      - name: Verify existing companion resources
        working-directory: video-companion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '0629de91516b2b363d1215708eaa5332'
        run: |
          node scripts/preflight-existing.mjs
      - name: Deploy companion only
        working-directory: video-companion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '0629de91516b2b363d1215708eaa5332'
        run: npx wrangler@4 pages deploy site --project-name video-mingli-world --branch main
      - name: Verify protected Pages production endpoints
        working-directory: video-companion
        env:
          VIDEO_BASE_URL: https://video-mingli-world.pages.dev
        run: node scripts/verify-live.mjs
      - name: Verify protected production endpoints
        working-directory: video-companion
        env:
          VIDEO_BASE_URL: https://video.mingli.world
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-live.mjs; then exit 0; fi
            sleep 10
          done
          exit 1

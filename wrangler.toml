name = "podcast-landing"
pages_build_output_dir = "site"
compatibility_date = "2026-07-05"

# NOTE: account_id must NOT go here — Pages projects reject it in the config
# file. The token can see two accounts, so CLOUDFLARE_ACCOUNT_ID is set in
# .github/workflows/deploy.yml and in the npm deploy script instead.

[[r2_buckets]]
binding = "FEEDBACK_BUCKET"
bucket_name = "podcast-mingli-world"
